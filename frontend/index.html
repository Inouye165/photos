<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuminaPhoto — AI Semantic Photo Studio</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Suppress benign browser extension messaging errors (e.g., disconnected background scripts)
      window.addEventListener('unhandledrejection', function (event) {
        var msg = event.reason && (event.reason.message || String(event.reason));
        if (
          msg &&
          (msg.indexOf('Could not establish connection. Receiving end does not exist.') !== -1 ||
           msg.indexOf('message channel closed') !== -1 ||
           msg.indexOf('The message port closed before a response was received.') !== -1)
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
